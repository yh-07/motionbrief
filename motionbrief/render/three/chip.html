<!-- Layer B ChipReveal: three.js toon chip on a transparent canvas. Driven per frame by toon.py:
     setup(spec) once, then draw(state) -> PNG data URL. Deterministic: state is a pure function of t. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import * as THREE from "./vendor/three.module.js";

let renderer, scene, camera, chip, traces = [], dots = [], spec;

let SOFT = true;  // Cartoon Tech v2: soft gradients for volume (hard toon bands only when spec.soft === false)

function toonRamp(colors, edges = [0.45, 0.93]) {
  // explicit band colours (given light -> dark) on N.L thresholds `edges`: shadow below 0.45, the body colour
  // across the lit face, the light colour only on surfaces turned toward the key (bevels/rims).
  // Hard: NearestFilter bands (classic toon, README). Soft (v2): smoothstep blends between the same colours,
  // matching the SVG layer's gradient shading. Bytes are raw sRGB, decoded by the sampler.
  const ramp = colors.slice().reverse().map(c => new THREE.Color().setStyle(c, THREE.LinearSRGBColorSpace));
  const n = 64, data = new Uint8Array(4 * n);
  const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const [dark, mid, light] = [ramp[0], ramp[Math.floor(ramp.length / 2)], ramp[ramp.length - 1]];
  for (let i = 0; i < n; i++) {
    const x = (i + 0.5) / n;
    let c;
    if (SOFT) {
      c = dark.clone().lerp(mid, ss(edges[0] - 0.25, edges[0] + 0.2, x)).lerp(light, 0.85 * ss(edges[1] - 0.08, 1.0, x));
    } else {
      c = x < edges[0] ? dark : x < edges[1] ? mid : light;
    }
    data.set([c.r * 255, c.g * 255, c.b * 255, 255], 4 * i);
  }
  const tex = new THREE.DataTexture(data, n, 1, THREE.RGBAFormat);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = tex.magFilter = SOFT ? THREE.LinearFilter : THREE.NearestFilter;
  tex.needsUpdate = true;
  return tex;
}

// MeshToonMaterial samples only the red channel of gradientMap (grey bands). Sample RGB instead so the
// Scene IR's gradientRamp colours *are* the bands.
const RGB_RAMP = THREE.ShaderChunk.gradientmap_pars_fragment.replace(
  "vec3( texture2D( gradientMap, coord ).r )", "texture2D( gradientMap, coord ).rgb");

function toonMat(colors) {
  const m = new THREE.MeshToonMaterial({ color: 0xffffff, gradientMap: toonRamp(colors) });
  m.onBeforeCompile = (sh) => {
    sh.fragmentShader = sh.fragmentShader.replace("#include <gradientmap_pars_fragment>", RGB_RAMP);
  };
  return m;
}

function roundedSlab(w, h, r, depth, bevel) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: true, bevelSize: bevel, bevelThickness: bevel,
                                           bevelSegments: 4, curveSegments: 10 });
  g.translate(0, 0, -depth / 2);
  return g;
}

function withOutline(mesh, width, color) {
  // inverted hull: back faces of a slightly scaled copy read as an ink line
  const hull = new THREE.Mesh(mesh.geometry, new THREE.MeshBasicMaterial({ color, side: THREE.BackSide }));
  hull.scale.setScalar(1 + width);
  mesh.add(hull);
  return mesh;
}

window.setup = (s) => {
  spec = s;
  SOFT = s.soft !== false;
  const c = document.getElementById("c");
  renderer = new THREE.WebGLRenderer({ canvas: c, alpha: true, antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(s.supersample || 1);  // MSAA suffices: 2x supersampling measured no visible gain (+20% time)
  renderer.setSize(s.size, s.size, false);
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(26, 1, 10, 5000);
  camera.position.set(0, -800, 1790);   // looking down onto the chip, like the 2.5D extrusion read
  camera.lookAt(0, 0, 0);
  // single key + low fill (README); toon BRDF is Lambert/pi, so pi * k maps the ramp ~1:1
  const key = new THREE.DirectionalLight(0xffffff, Math.PI * 0.95);
  key.position.set(-700, 600, 520);
  // no ambient: added white light lifts every dark colour toward grey in linear space; the ramp's dark
  // colour already is the shadow
  scene.add(key);

  const S = 460;
  chip = new THREE.Group();
  const body = withOutline(new THREE.Mesh(roundedSlab(S - 40, S - 40, 46, 60, 18),
                           toonMat(s.ramp)),
                           s.outlineWidth * (SOFT ? 0.35 : 1), s.outlineColor);  // v2: no heavy ink line
  chip.add(body);
  const pinMat = toonMat(["#F4F2FF", "#B9B3DA", "#5E587F"]);
  for (let k = 0; k < 8; k++) {
    const off = -S / 2 + 46 + k * (S - 92) / 7;
    for (const [px, py, w, h] of [[off, S / 2 + 6, 22, 56], [off, -S / 2 - 6, 22, 56],
                                  [-S / 2 - 6, off, 56, 22], [S / 2 + 6, off, 56, 22]]) {
      // no ink outline on pins: on 22px parts the hull reads as jagged noise (blind review, 3 frames)
      const pin = new THREE.Mesh(roundedSlab(w - 4, h - 4, 9, 8, 5), pinMat);
      pin.position.set(px, py, -14);
      chip.add(pin);
    }
  }
  const d = S * 0.6;
  const die = new THREE.Mesh(roundedSlab(d, d, 26, 14, 6), toonMat(["#2A2160", "#17123F", "#0B0826"]));
  die.position.z = 44;
  chip.add(die);
  const traceMat = () => new THREE.MeshBasicMaterial({ color: s.traceColor, transparent: true, opacity: 0.5 });
  for (let k = 1; k < 5; k++) {
    const a = new THREE.Mesh(new THREE.BoxGeometry(4, d - 36, 2), traceMat());
    a.position.set(-d / 2 + k * d / 5, 0, 59);
    const b = new THREE.Mesh(new THREE.BoxGeometry(d - 36, 4, 2), traceMat());
    b.position.set(0, -d / 2 + k * d / 5, 59);
    traces.push(a, b); chip.add(a, b);
  }
  for (let k = 0; k < 6; k++) {
    const dot = new THREE.Mesh(new THREE.SphereGeometry(7, 16, 12), new THREE.MeshBasicMaterial({ color: 0xE9FFFA }));
    const halo = new THREE.Mesh(new THREE.SphereGeometry(16, 16, 12),
                                new THREE.MeshBasicMaterial({ color: s.traceColor, transparent: true, opacity: 0.35 }));
    dot.add(halo); dots.push(dot); chip.add(dot);
  }
  scene.add(chip);
  return true;
};

window.draw = (st) => {
  // st.u: seconds since entrance; st.flash: impact flash 0..1
  const u = Math.max(0, st.u), d = 460 * 0.6;
  const settle = Math.min(1, u / 0.75);
  chip.rotation.set(-0.12 + 0.05 * Math.sin(u * 1.3), 0.18 * Math.sin(u * 0.9) + (1 - settle) ** 2 * 0.6,
                    0.04 * Math.sin(u * 0.7));
  const pulse = 0.35 + 0.35 * (0.5 + 0.5 * Math.sin(u * 4));
  for (const t of traces) t.material.opacity = Math.min(1, pulse + 0.5 * st.flash);
  dots.forEach((dot, k) => {
    const v = (u * 0.7 + k / 6) % 1, lane = 1 + k % 4;
    if (k % 2) dot.position.set(-d / 2 + 18 + v * (d - 36), -d / 2 + lane * d / 5, 62);
    else dot.position.set(-d / 2 + lane * d / 5, -d / 2 + 18 + v * (d - 36), 62);
  });
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL("image/png");
};

window.gpu = () => {
  const gl = renderer.getContext(), ext = gl.getExtension("WEBGL_debug_renderer_info");
  return ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : "unknown";
};
window.ready = true;
</script></body></html>
