[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motionbrief"
version = "0.1.0"
description = "AI technical short-video / motion storytelling engine (clean-room)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "jsonschema>=4.20",
  "pyyaml>=6",
  "numpy>=1.26",
  "pillow>=10",
  "cairosvg>=2.7",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
voice = ["misaki[zh]>=0.7.4", "scipy>=1.10"]

[project.scripts]
motionbrief = "motionbrief.apps.cli:main"

[tool.setuptools.packages.find]
include = ["motionbrief*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["render: renders real frames (slower)"]

[tool.ruff]
line-length = 120
